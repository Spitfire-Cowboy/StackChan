coverage:
  range: 60..85
  round: down
  precision: 2
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 70%
        threshold: 0%
        informational: true

comment:
  layout: "reach,diff,flags,tree"
  require_changes: true
  behavior: default

flags:
  server:
    paths:
      - server/
  app:
    paths:
      - app/

ignore:
  - "app/android/**"
  - "app/ios/**"
  - "firmware/**"
  - "remote/**"
  - "server/internal/model/do/**"
  - "server/internal/model/entity/**"
